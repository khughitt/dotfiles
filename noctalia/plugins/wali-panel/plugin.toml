id = "khughitt/wali-panel"
name = "Wali Panel"
description = "Browse and manage the current Noctalia wallpaper"
version = "1.0.0"
author = "Keith Hughitt"
plugin_api = 22
dependencies = ["walictl"]

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 588
height = 520
placement = "attached"
position = "auto"
keyboard_focus = "exclusive"
capture_keys = ["h", "Left", "l", "Right", "k", "Up", "j", "Down", "r", "f", "e", "y", "shift+question", "F1"]
