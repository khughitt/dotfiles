# TMPDIR for agent scratch and test temp on titan — exported by
# shell/local/titan.env.zsh, aged here with the same 10-day policy as /tmp
# (see /usr/lib/tmpfiles.d/tmp.conf). Persistent disk gets no tmpfs aging,
# so without this the debris that exhausted the /tmp usrquota (2026-08-18)
# would simply relocate and grow forever. `d` also recreates the directory
# if it ever goes missing, pairing with the zshenv guard.
d /mnt/ssd3/tmp 0700 - - 10d
