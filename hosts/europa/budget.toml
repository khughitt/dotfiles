# europa: the CPU budget host-budget hands heavy jobs; fractions, so correct before measuring.
# Responsiveness first. Reference: docs/host-budget.md.

[profiles.default] # short bursts such as test gates
share = 0.5        # at most this fraction of the host's CPUs to one job
reserve = 4        # CPUs never handed out: desktop, terminals, the agents themselves
min = 1

[profiles.long]    # a long run: expected to take more than about an hour; others share the host
share = 0.25
reserve = 4
min = 1

[profiles.quiet]   # a quiet run: the host was left idle for it
share = 1.0
reserve = 2
min = 1

[audio]
match = ["bitwig", "reaper", "ardour"]   # process name prefixes, case-insensitive
share = 0.25       # replaces the profile's share while any match is running
reserve = 12       # replaces the profile's reserve while any match is running

[scope]
slice = "background.slice"
nice = 10
io_class = "best-effort"
io_level = 7
