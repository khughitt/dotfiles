# Managed by apply-titan.sh — host-specific tuning for `titan`
# Dropbox registers one inotify watch per directory under ~/d, including the
# dropbox-ignored .venv/.worktrees/node_modules/target subtrees (~470k of ~580k
# directories, 2026-09). At the Arch default (524288) the user systemd manager
# was refused cgroup watches with ENOSPC. Shrinking the tree is tracked in the
# ops project (worktree and cache relocation); this is the headroom meanwhile.
fs.inotify.max_user_watches = 2097152
