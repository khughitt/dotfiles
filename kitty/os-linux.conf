# Linux-only kitty overrides, included from each Linux host's <hostname>.conf.

# remote-control socket (abstract unix sockets are Linux-only)
listen_on unix:@dotfiles-kitty

# copy last command output to the clipboard (wl-clipboard; Wayland-only)
map ctrl+shift+y launch --type=background --stdin-source=@last_cmd_output wl-copy

# The background is fully transparent (Prism emits background_opacity 0) and
# niri's glass material, generated by Prism, is the surface behind the text.
# niri's window `opacity` is not used: it would scale text and graphics too.

# Open an image path printed on screen (e.g. by an agent) without a shell round trip.
# ctrl+shift+p>i labels every image path, pick one to open it in imv; with shift,
# show it in an overlay over this window instead (any key closes it).
# Absolute, relative and bare names match; URLs and ~/ paths do not (imv gets no
# shell to expand ~). Relative paths resolve against the window's oldest foreground
# process: the shell, or an agent such as claude running in it.
map kitty_mod+p>i       kitten hints --type regex --regex '(?i)(?<![\w.~/:+@%-])[\w./+@%-]+\.(?:png|jpe?g|gif|webp|bmp|tiff?|svg)\b' --program "launch --type=background --cwd=oldest imv"
map kitty_mod+p>shift+i kitten hints --type regex --regex '(?i)(?<![\w.~/:+@%-])[\w./+@%-]+\.(?:png|jpe?g|gif|webp|bmp|tiff?|svg)\b' --program "launch --type=overlay --cwd=oldest kitten icat --hold"
# The same for a selected path (double-click selects a whole path).
map kitty_mod+i         launch --type=background --cwd=oldest imv @selection
map kitty_mod+alt+i     launch --type=overlay --cwd=oldest kitten icat --hold @selection
