# Linux-only kitty overrides, included from each Linux host's <hostname>.conf.

# remote-control socket (abstract unix sockets are Linux-only)
listen_on unix:@dotfiles-kitty

# copy last command output to the clipboard (wl-clipboard; Wayland-only)
map ctrl+shift+y launch --type=background --stdin-source=@last_cmd_output wl-copy

# The background is fully transparent (Prism emits background_opacity 0) and
# niri's glass material, generated by Prism, is the surface behind the text.
# niri's window `opacity` is not used: it would scale text and graphics too.
