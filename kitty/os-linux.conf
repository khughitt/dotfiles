# Linux-only kitty overrides.
# Symlinked to os-local.conf by setup.sh and pulled in via `include os-local.conf`.

# remote-control socket (abstract unix sockets are Linux-only)
listen_on unix:@dotfiles-kitty

# Background transparency is kitty's job, not the compositor's: niri's window
# `opacity` scales text and graphics along with the background, so the
# background/text split lives in kitty.conf + focus-opacity.py. niri only
# supplies the blur/saturation/noise behind the translucent background.
