# Fonts. A font_family that matches nothing does not error -- kitty silently
# falls back to the system monospace, so these strings need checking, not
# trusting. The old "... Nerd Font Complete" names here were Nerd Fonts v2 and
# had stopped matching anything; v3 ships "FiraCode Nerd Font" + style Retina.
#
# The family=/style= form takes real fontconfig family names (not the
# PostScript name the legacy `font_features` directive wants) and folds the
# feature list into the same line, so there is only one string to get right.
# Verify a change before trusting it:
#   fc-list : family,style | grep -i <name>
#   kitten choose-fonts                      # interactive, live preview
# Arch: ttf-firacode-nerd ttf-jetbrains-mono-nerd ttf-sourcecodepro-nerd
font_family       family="FiraCode Nerd Font" style=Retina features="+ss02 +ss03 +ss04 +ss05 +ss07 +cv28 +zero"
bold_font         family="JetBrainsMono Nerd Font" style=Bold
italic_font       family="Lilex Nerd Font" style=Italic
bold_italic_font  family="Lilex Nerd Font" style="Bold Italic"
italic_font       family="SauceCodePro Nerd Font" style=Italic
bold_italic_font  family="SauceCodePro Nerd Font" style="Bold Italic"

# Fira Code collapses != and => into single glyphs, which hides where the
# cursor actually is while editing inside one. This expands the ligature back
# into its component characters only on the cell under the cursor.
disable_ligatures cursor

# auto-reload settings (number = debounce delay)
auto_reload_config 0.1

# scrolling
scrollbar scrolled
scrollback_lines 8192
# +INPUT_LINE_NUMBER is substituted by kitty so the pager opens at the line you
# were looking at rather than the top; bare `moor` loses that. moor accepts the
# less-style +N form (a bogus flag exits 1, +N exits 0).
scrollback_pager moor --no-linenumbers +INPUT_LINE_NUMBER

# socket-only rather than `yes`: remote control stays reachable over the
# listen_on socket, but not from any process that merely has the tty. `kitty @`
# still works from the shell via $KITTY_LISTEN_ON, and focus-opacity.py drives
# opacity through the boss API rather than remote control, so neither breaks.
# listen_on is OS-specific (abstract sockets are Linux-only) -- see os-{linux,macos}.conf
allow_remote_control socket-only
cursor_stop_blinking_after 0.0
# Milliseconds the cursor must sit still before a jump draws a trail; the
# threshold keeps busy TUI redraws from smearing. cursor_trail_color comes from
# the theme (current-theme.conf).
cursor_trail 1
default_pointer_shape arrow
enable_audio_bell no
# Desktop notification when a command taking >=10s finishes in a window that is
# not focused. Needs shell integration (on by default) to know when a command
# started and ended. Pairs with the unfocus dimming below.
notify_on_cmd_finish unfocused 10.0
paste_actions confirm-if-large
strip_trailing_spaces smart
window_padding_width 4

# --- terminal glass: active/inactive knobs ---------------------------------
# background opacity: active here, inactive in focus-opacity.py. Keep the two
# ACTIVE values in sync -- this one is what a window starts at before its first
# focus event.
background_opacity 0.95
dynamic_background_opacity yes
watcher focus-opacity.py

# text opacity when this OS window is unfocused. A *positive* value fades text
# even when only one kitty window is visible; a negative one would only fade
# with 2+ splits. Multiplies glyph alpha only -- background and graphics are
# untouched, which is what keeps this independent of background_opacity.
inactive_text_alpha 0.93

# background_opacity only reaches cells painted in the *default* background
# color. Anything that paints its own background -- nvim's cursorline, lualine,
# barbar's tabs -- stays fully opaque and punches a solid rectangle through the
# glass. Listing those colors here makes them translucent too. Max 7 entries.
#
# Syntax is color@opacity; with @opacity omitted the color inherits
# background_opacity, i.e. exactly the same transparency as the window
# background. Append e.g. @0.5 to any single entry to make it more see-through
# than the body. Update these if the nvim colorscheme changes -- match by
# literal color value, dump them with:
#   nvim --headless -c 'lua print(vim.api.nvim_get_hl(0,{name="CursorLine"}).bg)' -c qa
#
# Four neutral slots cover nvim chrome by aliasing the closest pairs:
#   #1e2030  StatusLine / TabLine / current tab  #272a3f  inactive / tab fill
#   #2f334d  CursorLine                          #3b4261  lualine_b / Folded
# Three colored slots cover Claude/Codex added/removed diff cells and Claude's
# SGR-painted selection. The paired Kitty selection fallback/override lives
# after all static includes at the end of this file.
transparent_background_colors #1e2030 #2f334d #272a3f #3b4261 #022800@0.72 #3d0100@0.72 #003dbe@0.55
# ---------------------------------------------------------------------------

# tmux clipboard support
clipboard_control write-primary write-clipboard no-append

# keyboard mappings
map shift+insert      paste_from_selection
map ctrl+shift+v      paste_from_clipboard
# ctrl+shift+y (copy last command output) needs a platform clipboard binary, so
# it is bound in os-{linux,macos}.conf. Binding it here with wl-copy meant it
# silently did nothing on macOS -- --type=background swallows the exec failure.

# fix shift-backspace
map shift+backspace   send_text all \b

# claude code (https://github.com/anthropics/claude-code/issues/3853)
map shift+enter       send_text all \n

# navigate between claude code / codex-cli user prompts
# (alt+up/down reserved for tmux new-window/detach)
map ctrl+shift+up   combine : toggle_marker regex 1 [❯›] : scroll_to_mark prev 1 : toggle_marker regex 1 [❯›]
map ctrl+shift+down combine : toggle_marker regex 1 [❯›] : scroll_to_mark next 1 : toggle_marker regex 1 [❯›]

# external configs
#include ${HOME}/.cache/wal/colors-kitty.conf
include themes/noctalia.conf
include ${HOSTNAME}.conf

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# OS-specific overrides (os-local.conf -> os-{macos,linux}.conf, symlinked by setup.sh)
include os-local.conf

# Kept separate because `kitty +kitten themes` rewrites this file and comments
# direct color settings. This include remains stable across Noctalia reloads.
include noctalia-selection-fallback.conf
# Generated Noctalia transparency and selection-pair override. This must be the
# final include because Kitty applies the last value for each setting.
include ${HOME}/.cache/noctalia/nvim-glass/current/kitty-glass.conf
