# macOS-only kitty overrides.
# Symlinked to os-local.conf by setup.sh and pulled in via `include os-local.conf`.

# Fonts: brew nerd-font casks (font-fira-code-nerd-font, font-jetbrains-mono-nerd-font,
# font-sauce-code-pro-nerd-font). These are CoreText full-name strings; the
# shared config now uses kitty's family=/style= form, which should match the
# same faces here -- untested on macOS, so this override stays until it is.
# Note this picks JetBrainsMono NFM (Mono) for bold where the shared config
# picks the non-Mono face.
font_family       FiraCode Nerd Font Ret
font_features     FiraCodeNF-Ret +ss02 +ss03 +ss04 +ss05 +zero
bold_font         JetBrainsMono NFM Bold
italic_font       SauceCodePro NF Italic
bold_italic_font  SauceCodePro NF Bold Italic

# No background_opacity override here: it is a shared knob now, set in
# kitty.conf and driven on focus change by focus-opacity.py on both platforms.

# remote-control socket: macOS lacks abstract unix sockets, so use a
# filesystem path (kitty appends the pid to keep instances distinct)
listen_on unix:${TEMP}/dotfiles-kitty

# copy last command output to the clipboard (Linux uses wl-copy; see os-linux.conf)
map ctrl+shift+y launch --type=background --stdin-source=@last_cmd_output pbcopy
