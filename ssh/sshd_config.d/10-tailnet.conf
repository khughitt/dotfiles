# Tailnet-only, key-only sshd. Installed to /etc/ssh/sshd_config.d/; sshd keeps the
# first value it reads for most keywords, so the 10- prefix wins over 99-archlinux.conf.

# Only keith, and only from tailnet addresses. Tailscale's netfilter rules drop
# 100.64.0.0/10 sources that do not arrive on tailscale0, so a LAN host cannot
# spoof its way past this.
AllowUsers keith@100.64.0.0/10 keith@fd7a:115c:a1e0::/48
PermitRootLogin no

# Public keys only.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
