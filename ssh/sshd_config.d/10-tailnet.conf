# sshd hardening: key-only logins, from the tailnet only.
# Installed to /etc/ssh/sshd_config.d/10-tailnet.conf. sshd keeps the FIRST value
# it reads for most keywords and Arch's sshd_config includes this directory at the
# top, so the low number makes these win over 99-archlinux.conf.

# Keys only. KbdInteractiveAuthentication would otherwise let PAM ask for the
# password, which bypasses PasswordAuthentication.
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# One user, and only from Tailscale addresses (CGNAT range and the tailnet's IPv6
# ULA prefix). sshd still listens on every interface, so it starts without waiting
# for tailscale0 to get its address; a LAN client is refused after the handshake.
AllowUsers keith@100.64.0.0/10 keith@fd7a:115c:a1e0::/48

MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
